*{
margin:0;
padding:0;

}

:root{
--yellow:#FFD54F;
--pink1:#ff4fa3;
--pink2:#ff7abf;
--pink3:#ff2d92;
--text:#ffffff;
--card:rgba(14,20,45,.82);
}

html,body{
height:100%;
overflow:hidden;
font-family:Trebuchet MS,Verdana,Arial,sans-serif;

/* Animated Sports Background */

body{

background:
linear-gradient(-45deg,
#3c096c,
#5a189a,
#4361ee,
#00b4d8,
#3c096c);

animation:bgMove 18s ease infinite;

display:flex;
justify-content:center;
align-items:center;
padding:18px;
position:relative;

}

/* Floating Balls */

body::before,
body::after{

content:"";
position:absolute;
border-radius:50%;
filter:blur(10px);
opacity:.25;
animation:float 8s ease-in-out infinite;

}

body::before{

width:180px;
height:180px;
background:#FFD54F;
top:-50px;
left:-40px;

}

body::after{

width:220px;
height:220px;
background:#ff5ca8;
bottom:-70px;
right:-60px;
animation-delay:2s;

}

.card{

width:100%;

text-align:center;

}

.dp{

width:120px;
height:120px;

border-radius:50%;

object-fit:cover;

border:5px solid var(--yellow);

box-shadow:
0 0 30px rgba(255,213,79,.45);

}

h1{

margin-top:18px;

font-size:2.2rem;

font-family:Impact, Haettenschweiler, Arial Black, sans-serif;

letter-spacing:1px;

color:#FFE66D;

text-shadow:
0 2px 10px rgba(255,255,255,.2);

}

.tagline{

margin-top:12px;

font-size:1rem;

font-weight:700;

color:#B8F7FF;

line-height:1.6;

}

.counterBox{

margin-top:24px;

background:rgba(255,255,255,.08);

padding:18px;

border-radius:20px;

}

.counterLabel{

font-size:.95rem;

color:#d8d8d8;

}

.counter{

margin-top:10px;

font-size:2.1rem;

font-weight:900;

color:#90ffbf;

}

.desc{

margin-top:22px;

line-height:1.7;

font-size:1rem;

color:#f4f4f4;

}

/* Telegram Button */

.btn{

display:block;

margin-top:30px;

90deg,
var(--pink1),
var(--pink2),
var(--pink3));

background-size:200% 200%;

box-shadow:
0 10px 30px rgba(255,60,150,.45);

animation:
pulse 2s infinite,
pinkFlow 4s linear infinite;

transition:.35s;

}

.btn:hover{

transform:translateY(-3px);

box-shadow:
0 14px 35px rgba(255,60,150,.55);

}

.footer{

margin-top:22px;

font-size:.82rem;

color:#d6d6d6;

}

/* Animations */

@keyframes bgMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-30px);
}

100%{
transform:translateY(0px);
}

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

@keyframes pinkFlow{

0%{

<script>

const counter=document.getElementById("counter");

let value=35467;
const end=35490;

function animateCounter(){

if(value>=end) return;

value++;

counter.textContent=value.toLocaleString();

let delay=150+Math.random()*420;

if(value>35484){
delay=260+Math.random()*500;
}

setTimeout(animateCounter,delay);

}

setTimeout(animateCounter,700);

</script>
