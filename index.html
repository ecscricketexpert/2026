    /* =================================

const subscriber =
document.getElementById("subscriber");


let currentSubscribers = 35467;

const targetSubscribers = 35490;



function increaseSubscribers(){


if(currentSubscribers >= targetSubscribers){

return;

}


currentSubscribers++;


subscriber.textContent =
currentSubscribers.toLocaleString();



/*
 Random delay makes it look
 like real people joining
*/


let delay =
300 + Math.random() * 900;



/*
 Slow down near the end
*/


if(currentSubscribers > 35482){

delay =
700 + Math.random() * 1400;

}



setTimeout(

increaseSubscribers,

delay

);


}



/*
 Start counter after page load
*/

increaseSubscribers,

1200

);





/* =================================
   ONLINE USERS ANIMATION

 Creates live feeling numbers
*/

document.querySelector(".trust-box");


let onlineUsers = 1482;

Math.floor(

Math.random()*7

)-3;



onlineUsers += change;

}

onlineUsers = 1500;
